<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #1a1a1a; background: #fff; padding: 16px; }
  h1 { font-size: 15px; font-weight: 700; color: #534AB7; margin-bottom: 16px; }
  h1 svg { flex-shrink: 0; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  input, select, textarea { width: 100%; font-size: 13px; font-family: inherit; border: 1px solid #e2e8f0; border-radius: 7px; padding: 7px 10px; outline: none; background: #fafafa; color: #1a1a1a; }
  input:focus, select:focus, textarea:focus { border-color: #534AB7; background: #fff; }
  textarea { min-height: 80px; resize: vertical; }
  .email-chip { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #555; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .email-chip svg { flex-shrink: 0; color: #534AB7; }
  .email-chip .subject { font-weight: 500; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-chip .from { color: #888; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 4px; }
  .btn-primary { background: #534AB7; color: white; }
  .btn-primary:hover { background: #4338a0; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; }
  .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #16a34a40; display: block; }
  .status.error { background: #fef2f2; color: #c0392b; border: 1px solid #c0392b40; display: block; }
  .server-warn { background: #fef3e2; color: #d97706; border: 1px solid #d9770640; border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; display: none; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
</style>
</head>
<body>

<h1>
  Create TaskFlow Task
</h1>

<div class="server-warn" id="server-warn">
  ⚠ TaskFlow server not running. Start TaskFlow first.
</div>

<div id="email-chip" class="email-chip" style="display:none;">
  <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 5l6 4 6-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div style="overflow:hidden;">
    <div class="subject" id="chip-subject"></div>
    <div class="from" id="chip-from"></div>
  </div>
</div>


<div class="field">
  <label>Task Name</label>
  <input type="text" id="task-title" placeholder="Task title…">
</div>

<div class="row">
  <div class="field">
    <label>Client</label>
    <select id="task-client"><option value="">No client</option></select>
  </div>
  <div class="field">
    <label>Priority</label>
    <select id="task-priority"></select>
  </div>
</div>

<div class="row">
  <div class="field">
    <label>Status</label>
    <select id="task-status"></select>
  </div>
  <div class="field">
    <label>Due Date</label>
    <input type="date" id="task-due">
  </div>
</div>

<div class="field">
  <label>Description</label>
  <textarea id="task-desc" placeholder="Optional description…"></textarea>
</div>

<button class="btn btn-primary" id="create-btn" onclick="createTask()">Create Task</button>
<div class="status" id="status-msg"></div>

<div style="text-align:center;font-size:10px;color:#bbb;margin-top:16px;">App Version: 1.0.5</div>

<script>
const SERVER = 'http://127.0.0.1:5678';
let emailItem = null;
let config = null;

Office.onReady(async (info) => {
  console.log('[TaskFlow Addin] Office.onReady fired. Host:', info.host, '| Platform:', info.platform);

  if (info.host === Office.HostType.Outlook) {
    console.log('[TaskFlow Addin] Host confirmed as Outlook — proceeding with init');
    try {
      emailItem = Office.context.mailbox.item;
      console.log('[TaskFlow Addin] emailItem obtained:', !!emailItem);
      await checkServer();
      console.log('[TaskFlow Addin] checkServer completed');
      await loadConfig();
      console.log('[TaskFlow Addin] loadConfig completed. clients=' + (config?.clients?.length ?? 'null') + ' priorities=' + (config?.priorities?.length ?? 'null') + ' statuses=' + (config?.taskStatuses?.length ?? 'null'));
      prefillFromEmail();
      console.log('[TaskFlow Addin] prefillFromEmail completed');

      // Refresh the pane whenever the user selects a different email
      // (task pane can stay pinned/open across email selections)
      Office.context.mailbox.addHandlerAsync(
        Office.EventType.ItemChanged,
        () => {
          console.log('[TaskFlow Addin] Item changed — refreshing email context');
          emailItem = Office.context.mailbox.item;
          prefillFromEmail();
        },
        (result) => {
          if (result.status === Office.AsyncResultStatus.Failed) {
            console.warn('[TaskFlow Addin] Could not register ItemChanged handler:', result.error?.message);
          } else {
            console.log('[TaskFlow Addin] ItemChanged handler registered successfully');
          }
        }
      );
    } catch (initErr) {
      console.error('[TaskFlow Addin] INIT SEQUENCE FAILED:', initErr.name, '-', initErr.message);
    }
  } else {
    console.warn('[TaskFlow Addin] Host is NOT Outlook — init skipped. Host was:', info.host);
    setStatus('host is NOT Outlook: ' + info.host);
  }
});

async function checkServer() {
  document.getElementById('server-warn').style.display = 'none';
  document.getElementById('create-btn').disabled = false;

  const attempt = async (timeoutMs) => {
    const r = await fetch(SERVER + '/ping', { signal: AbortSignal.timeout(timeoutMs) });
    if (!r.ok) throw new Error('Server responded with status ' + r.status);
  };

  const timeouts = [3000, 5000, 8000];
  for (let i = 0; i < timeouts.length; i++) {
    try {
      console.log('[TaskFlow Addin] Checking server at:', SERVER + '/ping (attempt ' + (i + 1) + '/' + timeouts.length + ', timeout ' + timeouts[i] + 'ms)');
      await attempt(timeouts[i]);
      console.log('[TaskFlow Addin] Server check succeeded (attempt ' + (i + 1) + ')');
      return;
    } catch (err) {
      console.warn('[TaskFlow Addin] Attempt ' + (i + 1) + ' failed:', err.name, '-', err.message);
      if (i < timeouts.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 500));
      } else {
        console.error('[TaskFlow Addin] Server check FAILED after all attempts');
        const warnEl = document.getElementById('server-warn');
        warnEl.innerHTML = '&#9888; TaskFlow server not running. Start TaskFlow first.<br><small style="opacity:.75;">Debug: ' + (err.name || 'Error') + ' - ' + (err.message || 'unknown') + '<br>URL: ' + SERVER + '/ping</small><br><button onclick="retryServerCheck()" style="margin-top:8px;padding:6px 14px;border-radius:6px;border:1px solid #d97706;background:none;color:#d97706;font-size:12px;font-weight:600;cursor:pointer;">Retry</button>';
        warnEl.style.display = 'block';
        document.getElementById('create-btn').disabled = true;
      }
    }
  }
}

function retryServerCheck() {
  checkServer();
}

async function loadConfig() {
  try {
    const r = await fetch(SERVER + '/getconfig', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    config = await r.json();

    // Clients
    const clientSel = document.getElementById('task-client');
    (config.clients || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      clientSel.appendChild(opt);
    });

    // Priorities
    const priSel = document.getElementById('task-priority');
    priSel.innerHTML = '';
    (config.priorities || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.label || p.name || '';
      priSel.appendChild(opt);
    });

    // Task statuses
    const statusSel = document.getElementById('task-status');
    statusSel.innerHTML = '';
    (config.taskStatuses || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      statusSel.appendChild(opt);
    });
  } catch(e) {
    console.error('Failed to load config:', e);
  }
}

function prefillFromEmail() {
  if (!emailItem) return;

  // Subject → task title
  const subject = emailItem.subject || '';
  document.getElementById('task-title').value = subject;

  // Show email chip
  const from = emailItem.from?.displayName || emailItem.from?.emailAddress || '';
  document.getElementById('chip-subject').textContent = subject;
  document.getElementById('chip-from').textContent = 'From: ' + from;
  document.getElementById('email-chip').style.display = 'flex';
}

async function createTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) {
    document.getElementById('task-title').focus();
    return;
  }

  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    // Build linked resource from email
    const links = [];
    if (emailItem) {
      try {
        const subject = emailItem.subject || '';
        const from = emailItem.from?.displayName || '';
        const date = emailItem.dateTimeCreated ? new Date(emailItem.dateTimeCreated).toISOString().split('T')[0] : '';

        // Build a deep link that opens the SPECIFIC email, not just the inbox homepage.
        // webLink is often empty/unreliable in New Outlook, and ewsUrl-based construction
        // only ever produced a generic "/mail/" homepage link (not a real deep link) —
        // this uses the item's itemId directly, which reliably opens the exact message.
        // NOTE: this itemId-based link breaks if the email is later moved to a different
        // folder (a Microsoft platform limitation of the classic Exchange ID format).
        let emailUrl = 'https://outlook.office365.com/mail/';
        try {
          if (emailItem.webLink) {
            emailUrl = emailItem.webLink;
          } else if (emailItem.itemId) {
            emailUrl = 'https://outlook.office365.com/owa/?ItemID=' + encodeURIComponent(emailItem.itemId) + '&exvsurl=1&viewmodel=ReadMessageItem';
          }
        } catch (linkBuildErr) {
          console.warn('[TaskFlow Addin] Could not build deep link, using generic mail URL:', linkBuildErr.message);
        }

        // Try to upgrade to a stable, move-proof link. The add-in has no Microsoft
        // Graph auth of its own, so this relays through the desktop app (which does)
        // via the local server — queue the request, then poll briefly for the result.
        // Falls back silently to the itemId-based link above if the desktop app isn't
        // reachable, isn't signed in, or doesn't respond in time.
        //
        // Sends BOTH internetMessageId and a convertToRestId-derived classicId,
        // since each has been confirmed unreliable on its own in different ways:
        // - convertToRestId() output looks like a valid REST ID but doesn't survive
        //   translateExchangeIds correctly (confirmed via testing — link broke after
        //   a folder move even though the "immutable" ID looked superficially valid).
        // - internetMessageId is sometimes simply empty (a known, longstanding Office.js
        //   platform bug affecting various Outlook clients/versions).
        // The desktop app tries internetMessageId first (cleaner, no known correctness
        // issue, just occasional unavailability), falling back to a direct Graph
        // lookup-by-id using the classicId if that's not present.
        try {
          const internetMessageId = emailItem.internetMessageId || '';
          let classicId = '';
          try {
            if (emailItem.itemId) {
              classicId = Office.context.mailbox.convertToRestId(
                emailItem.itemId, Office.MailboxEnums.RestVersion.v2_0
              );
            }
          } catch (convertErr) {
            console.warn('[TaskFlow Addin] convertToRestId failed:', convertErr.message);
          }
          if (!internetMessageId && !classicId) {
            alert('DEBUG - both internetMessageId and classicId are empty, skipping queue entirely'); // TEMPORARY - remove after diagnosing
          }
          if (internetMessageId || classicId) {
            const queueRes = await fetch(SERVER + '/queueEmailTranslate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ internetMessageId, classicId })
            });
            if (queueRes.ok) {
              const { requestId } = await queueRes.json();
              alert('DEBUG - queued successfully, requestId: ' + requestId); // TEMPORARY - remove after diagnosing
              // Poll for up to ~8 seconds (desktop app polls the queue every 3s,
              // so this gives it a couple of cycles to pick up and complete the work)
              let gotResult = false;
              for (let attempt = 0; attempt < 8; attempt++) {
                await new Promise(r => setTimeout(r, 1000));
                const pollRes = await fetch(SERVER + '/emailTranslateResult?requestId=' + encodeURIComponent(requestId));
                if (!pollRes.ok) break;
                const { ready, result } = await pollRes.json();
                if (ready) {
                  gotResult = true;
                  if (result?.immutableId) {
                    emailUrl = 'https://outlook.cloud.microsoft/mail/deeplink/read/' + encodeURIComponent(result.immutableId);
                  } else {
                    console.warn('[TaskFlow Addin] Stable link translation failed, using itemId-based link:', result?.error);
                    alert('DEBUG - translation failed: ' + result?.error); // TEMPORARY - remove after diagnosing
                  }
                  break;
                }
              }
              if (!gotResult) {
                alert('DEBUG - never got a result after polling (timed out)'); // TEMPORARY - remove after diagnosing
              }
            } else {
              alert('DEBUG - queueEmailTranslate POST failed, status: ' + queueRes.status); // TEMPORARY - remove after diagnosing
            }
          }
        } catch (stableLinkErr) {
          console.warn('[TaskFlow Addin] Could not get stable link, using itemId-based link:', stableLinkErr.message);
          alert('DEBUG - stable link error: ' + stableLinkErr.message); // TEMPORARY - remove after diagnosing
        }

        links.push({
          id: 'email-' + Date.now(),
          type: 'outlook',
          name: subject + (from ? ' (' + from + ')' : ''),
          url: emailUrl,
          meta: from + (date ? ' · ' + date : ''),
          icon: '<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 5l6 4 6-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        });
      } catch (linkErr) {
        console.warn('[TaskFlow Addin] Could not build email link, continuing without it:', linkErr.message);
      }
    }

    const task = {
      title,
      client:      document.getElementById('task-client').value || '',
      priority:    document.getElementById('task-priority').value || '',
      taskStatus:  document.getElementById('task-status').value || '',
      due:         document.getElementById('task-due').value || '',
      description: document.getElementById('task-desc').value.trim(),
      links,
    };

    console.log('[TaskFlow Addin] Creating task at:', SERVER + '/newtask');
    const r = await fetch(SERVER + '/newtask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(task),
      signal: AbortSignal.timeout(8000)
    });
    const data = await r.json();
    if (data.ok) {
      console.log('[TaskFlow Addin] Task created successfully');
      showStatus('success', '✓ Task created successfully!');
      // Reset description/due date, but refill title from the email
      // (so recreating a task for the same email after deleting it just works,
      // without needing to close/reopen the pane)
      document.getElementById('task-desc').value = '';
      document.getElementById('task-due').value = '';
      prefillFromEmail();
    } else {
      showStatus('error', '✗ Error: ' + (data.error || 'Unknown error'));
    }
  } catch(e) {
    console.error('[TaskFlow Addin] Create task FAILED:', e.name, '-', e.message);
    showStatus('error', '✗ ' + (e.name || 'Error') + ': ' + (e.message || 'Could not reach TaskFlow server'));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Task';
  }
}

function showStatus(type, msg) {
  const el = document.getElementById('status-msg');
  el.className = 'status ' + type;
  el.textContent = msg;
  el.style.display = 'block';
  if (type === 'success') setTimeout(() => el.style.display = 'none', 4000);
}
</script>
</body>
</html>
